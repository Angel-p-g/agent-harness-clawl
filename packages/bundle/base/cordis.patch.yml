# dsh-mini base bundle: one insert over the empty profile root.
#
# Later bundle patches, the profile patch, the home patch, and --patch overlays
# address these rows by id. A patch replaces the targeted row's whole config;
# it does not deep-merge. Row order carries no load semantics: activation is
# driven by service availability and each plugin's `inject` declaration.

- insert:
    # --- kernel clock -------------------------------------------------------
    - id: timer
      name: '@cordisjs/plugin-timer'

    # --- model seam ---------------------------------------------------------
    - id: llm
      name: '@dsh-mini/llm'

    - id: llm-deepseek
      name: '@dsh-mini/llm-deepseek'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
        baseURL: https://api.deepseek.com
        model: deepseek-chat
        maxTokens: 8192

    # --- history, prompt, tools --------------------------------------------
    - id: session
      name: '@dsh-mini/session'

    - id: system-prompt
      name: '@dsh-mini/system-prompt'
      config:
        persona: |-
          You are dsh-mini, a minimal tool-using assistant.
          Prefer tools over guessing. Cite the sources returned by web_search.
        includeRuntimeContext: true

    - id: tools
      name: '@dsh-mini/tools'

    # --- filesystem seam ----------------------------------------------------
    - id: fs
      name: '@dsh-mini/fs'

    - id: fs-local
      name: '@dsh-mini/fs-local'
      config:
        workingDirectory: !!js process.cwd()

    # --- web seam -----------------------------------------------------------
    - id: web
      name: '@dsh-mini/web'

    - id: web-fetch-http
      name: '@dsh-mini/web-fetch-http'
      config:
        timeoutMs: 30000
        maxBodyBytes: 2097152

    - id: web-search-brave
      name: '@dsh-mini/web-search-brave'
      config:
        apiKeyEnv: BRAVE_SEARCH_API_KEY
        maxResults: 5
        timeoutMs: 30000

    # --- model-facing tools -------------------------------------------------
    - id: tool-fs
      name: '@dsh-mini/tool-fs'
      config:
        read: true
        defaultLimit: 2000

    - id: tool-web
      name: '@dsh-mini/tool-web'
      config:
        search: true
        fetch: true
        searchMaxResults: 5
        fetchMaxChars: 50000
        timeoutMs: 30000

    # --- agent driver -------------------------------------------------------
    - id: scope
      name: '@dsh-mini/scope'

    - id: agent
      name: '@dsh-mini/agent'

    - id: agent-loop
      name: '@dsh-mini/agent-loop'
      config:
        maxSteps: 50
        maxRetries: 2
